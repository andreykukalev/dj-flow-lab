name: Deploy

# Production deploys on pushes to main (or a manual run on main); every pull request
# gets its own preview environment, which is removed when the pull request closes.
# Deployment is skipped until the AZURE_STATIC_WEB_APPS_API_TOKEN secret is set.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # A merged pull request's closed event has github.ref set to the base branch, so the
    # event name must be checked too, or the deploy re-creates the preview that
    # close-preview just removed.
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
      - name: Explain skipped deploy
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Deploy skipped because the AZURE_STATIC_WEB_APPS_API_TOKEN secret is not set."

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close preview environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: close
          app_location: dist
