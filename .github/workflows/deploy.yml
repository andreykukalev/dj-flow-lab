name: Deploy

# Production deploys on pushes to main (or a manual run on main). There are no preview
# environments: pull requests are checked by CI and go to the live site when merged.
# Deployment is skipped until the AZURE_STATIC_WEB_APPS_API_TOKEN secret is set.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
      - name: Explain skipped deploy
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Deploy skipped because the AZURE_STATIC_WEB_APPS_API_TOKEN secret is not set."
