name: CI

# Every job must finish within 5 minutes (timeout-minutes). Pull requests and main run
# the browser tests without the @slow measurements; a manual run includes them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Firefox keeps a real-time AudioContext suspended when the machine has no
      # audio output, so give it a virtual one. Chromium uses its own fake output
      # and must not see PulseAudio here (its clock stalls on the null sink).
      - name: Virtual audio device
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
      - run: npx playwright test --project=${{ matrix.browser }} ${{ github.event_name != 'workflow_dispatch' && '--grep-invert @slow' || '' }}

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and lint Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
